<!DOCTYPE html>
<html lang="en">ddd
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do App - Javascript CRUD</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-slate-100">
        <div class="bg-white max-w-md mx-auto rounded-lg mt-10 shadow-md">
            
            <div class="bg-indigo-500 p-5 rounded-t-lg">
                <h1 class="text-white font-bold text-xl">To-Do App</h1>
            </div>
            
            <div class="p-5">  
                <form id="form" class="flex gap-5">
                    <input id="todo-input" type="text" class="border flex-1 border-slate-300 rounded p-2 outline-indigo-500" placeholder="Enter task Description...">
                    <button type="submit" class="px-5 py-3 text-white bg-violet-700 rounded hover:bg-violet-800 transition" id="form-btn">Add</button>
                </form>
                
                <div class="flex justify-between pt-5 pb-1 text-xs border-b border-black font-semibold text-slate-600">
                    <p id="task-count">TASK (0)</p>
                    <p id="completed-count">COMPLETED: 0</p>
                </div>

                <ul id="todo-list" class="py-5 flex flex-col gap-3">
                    <!-- 
                    <li data-id="1" class="flex gap-2 border border-slate-300 p-4 rounded-xl items-center">
                        <input data-action="toggle" type="checkbox" class="w-5 h-5 cursor-pointer">
                        <p class="flex-1">Go to Gym</p>
                        <div class="flex gap-2">
                            <button data-action="edit" data-id="1" class="text-blue-500">Edit</button>
                            <button data-action="delete" data-id="1" class="text-red-500">Delete</button>
                        </div>
                    </li> 
                    -->
                </ul>
            </div>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
